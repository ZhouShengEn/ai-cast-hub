name: Build Flutter APK & Sync to Gitee
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1.拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整拉取历史，同步Gitee需要

      # 2.配置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'

      # 3.安卓SDK环境
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4.缓存依赖加速打包
      - name: Cache Flutter & Gradle deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle
            flutter-app/.dart_tool
            flutter-app/build
          key: flutter-build-v2-${{ hashFiles('flutter-app/pubspec.yaml', 'flutter-app/android/app/build.gradle.kts') }}
          restore-keys: |
            flutter-build-v2-

      # 5.国内镜像安装依赖
      - name: Install dependencies
        working-directory: ./flutter-app
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
        run: flutter pub get

      # 5.1 修复 flutter_webrtc SurfaceTextureRenderer 缺少 onSurfaceDestroyed
      - name: Patch flutter_webrtc SurfaceTextureRenderer
        run: |
          FILE=$(find ~/.pub-cache -name "SurfaceTextureRenderer.java" -path "*/flutter_webrtc*" 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            echo "Patching: $FILE"
            sed -i '/new TextureRegistry\.SurfaceProducer\.Callback() {/a\                @Override\n                public void onSurfaceDestroyed() {}' "$FILE"
            echo "Patch applied successfully"
          else
            echo "WARNING: SurfaceTextureRenderer.java not found, skipping patch"
          fi

      # 6.编译Debug测试APK
      - name: Build Debug APK
        working-directory: ./flutter-app
        run: flutter build apk --debug

      # 7.上传APK到GitHub Release（必须先打Release才能同步到Gitee）
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.sha }} # 用commit哈希作为版本tag
          name: Flutter Build ${{ github.sha }}
          files: flutter-app/build/app/outputs/flutter-apk/*.apk

      # 8.同步整个仓库代码 + Release附件APK到Gitee
      - name: Sync code & APK release to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          # GitHub源仓库
          src: github/ZhouShengEn/ai-cast-hub
          # 你的Gitee用户名/仓库名，替换这里！
          dst: gitee/zhou-sheng-en/ai-cast-hub
          # Gitee令牌密钥
          gitee-token: ${{ secrets.GITEE_TOKEN }}
          # 同步Release发布包（关键：同步APK）
          sync-release: true
          # 同步所有分支
          sync-branch: true
