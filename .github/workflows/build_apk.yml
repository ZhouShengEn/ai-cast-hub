name: Build Flutter APK
on:
  push:
    branches: [ master ]
  workflow_dispatch: # 网页手动一键打包

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 拉取完整仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 配置Flutter环境（改成你项目实际版本）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      # 安装Android编译SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 缓存依赖，加速重复打包
      #
      # 注意：key 里的 v2 是「缓存源版本」标记。
      # 早期构建曾用 PUB_HOSTED_URL=pub.flutter-io.cn 填充过该缓存，
      # 混用不同 pub 源会导致 content-hash 校验失败（pub 报
      # "This indicates a problem on the package repository"）。
      # 一旦更换 pub 源，必须同步改这里的前缀以丢弃旧缓存。
      - name: Cache Flutter & Gradle deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle
            flutter-app/.dart_tool
            flutter-app/build
          key: flutter-v2-${{ hashFiles('flutter-app/pubspec.yaml') }}
          restore-keys: |
            flutter-v2-

      # 解析依赖
      #
      # 这里【不要】设置 PUB_HOSTED_URL 指向国内镜像：GitHub Actions runner 在海外，
      # pub.dev 直连更快更稳；镜像一旦同步滞后或内容哈希不一致，就会让 pub get 直接失败。
      # 国内本地开发如需加速，请在自己机器上 export PUB_HOSTED_URL=https://pub.flutter-io.cn。
      - name: Install dependencies
        working-directory: ./flutter-app
        run: flutter pub get

      # 编译Debug测试APK
      # 只编 arm64-v8a：真机主流架构。x86/x86_64 仅模拟器用，且 Flutter 已宣布
      # 在 3.27 之后的稳定版移除 x86 支持；armeabi-v7a 为老设备兜底，按需再开。
      # 加 --target-platform 后只产出 app-arm64-v8a-debug.apk 一个文件，构建也更快。
      - name: Build Debug APK
        working-directory: ./flutter-app
        run: flutter build apk --debug --split-per-abi --target-platform android-arm64

      # 上传APK产物（仅 arm64 单包，保留 7 天）
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Debug-APK
          path: flutter-app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 7
