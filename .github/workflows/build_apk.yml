name: Build Flutter APK
on:
  push:
    branches: [ master ]
  workflow_dispatch: # 网页手动一键打包

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 拉取完整仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 配置Flutter环境（改成你项目实际版本）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      # 安装Android编译SDK
      #
      # 这里【不】使用 android-actions/setup-android@v3：
      # 它会把 runner 预装的 cmdline-tools 判定为
      # "Wrong version in preinstalled sdkmanager"，于是重新下载 cmdline-tools 16.0，
      # 随后在 `sdkmanager --licenses` 阶段异常退出（exit 1），
      # 导致任务在真正编译之前就失败。
      # ubuntu-latest 镜像本身已预装 Android SDK（platform-tools / build-tools /
      # platforms）并已接受过许可，因此只需把 cmdline-tools、platform-tools 暴露到
      # PATH，再容错地接受一次许可即可。
      - name: Setup Android SDK
        run: |
          set -uo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID SDK root: $SDK_ROOT"

          # 取版本号最高的可用 cmdline-tools（镜像里可能同时存在 latest 与具体版本）
          CMDLINE_BIN=""
          for dir in $(ls -d "$SDK_ROOT"/cmdline-tools/*/ 2>/dev/null | sort -V -r); do
            if [ -x "${dir}bin/sdkmanager" ]; then
              CMDLINE_BIN="${dir}bin"
              break
            fi
          done
          if [ -z "$CMDLINE_BIN" ] && [ -x "$SDK_ROOT/tools/bin/sdkmanager" ]; then
            CMDLINE_BIN="$SDK_ROOT/tools/bin"
          fi
          echo "cmdline-tools bin: ${CMDLINE_BIN:-<not found>}"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          if [ -z "$CMDLINE_BIN" ]; then
            echo "::warning::未找到 sdkmanager，直接使用镜像预装 SDK"
          else
            echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
            # 用环境变量而非已废弃的 --sdk_root 指定 SDK 路径
            export ANDROID_SDK_ROOT="$SDK_ROOT"
            export ANDROID_HOME="$SDK_ROOT"

            # 接受许可：失败也不阻塞（镜像 licenses 目录通常已存在且有效）
            if yes | "$CMDLINE_BIN/sdkmanager" --licenses > /dev/null 2>&1; then
              echo "Android SDK licenses accepted."
            elif yes | flutter doctor --android-licenses > /dev/null 2>&1; then
              echo "Android SDK licenses accepted (via flutter doctor)."
            else
              echo "::warning::无法主动接受许可，沿用镜像预装的 licenses"
            fi

            # 按需补齐编译所需组件。
            # app/build.gradle.kts 里 compileSdk = 36、ndkVersion = 27.0.12077973，
            # 镜像若未预装会由 Gradle 自动下载；这里显式补装可让失败原因更清晰。
            install_if_missing() {
              local pkg="$1" dir="$2"
              if [ -e "$SDK_ROOT/$dir" ]; then
                echo "已存在: $pkg"
                return 0
              fi
              echo "安装: $pkg"
              if yes | "$CMDLINE_BIN/sdkmanager" "$pkg" > /dev/null 2>&1; then
                echo "已安装: $pkg"
              else
                echo "::warning::$pkg 安装失败，交由 Gradle 自动下载"
              fi
            }
            install_if_missing "platforms;android-36" "platforms/android-36"
            install_if_missing "ndk;27.0.12077973" "ndk/27.0.12077973"
          fi

          echo "---- platforms ----"
          ls "$SDK_ROOT/platforms" 2>/dev/null || true
          echo "---- build-tools ----"
          ls "$SDK_ROOT/build-tools" 2>/dev/null || true
          echo "---- ndk ----"
          ls "$SDK_ROOT/ndk" 2>/dev/null || true
          echo "---- licenses ----"
          ls "$SDK_ROOT/licenses" 2>/dev/null || true

      # 缓存依赖，加速重复打包
      #
      # 注意：key 里的 v2 是「缓存源版本」标记。
      # 早期构建曾用 PUB_HOSTED_URL=pub.flutter-io.cn 填充过该缓存，
      # 混用不同 pub 源会导致 content-hash 校验失败（pub 报
      # "This indicates a problem on the package repository"）。
      # 一旦更换 pub 源，必须同步改这里的前缀以丢弃旧缓存。
      - name: Cache Flutter & Gradle deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle
            flutter-app/.dart_tool
            flutter-app/build
          key: flutter-v2-${{ hashFiles('flutter-app/pubspec.yaml') }}
          restore-keys: |
            flutter-v2-

      # 解析依赖
      #
      # 这里【不要】设置 PUB_HOSTED_URL 指向国内镜像：GitHub Actions runner 在海外，
      # pub.dev 直连更快更稳；镜像一旦同步滞后或内容哈希不一致，就会让 pub get 直接失败。
      # 国内本地开发如需加速，请在自己机器上 export PUB_HOSTED_URL=https://pub.flutter-io.cn。
      - name: Install dependencies
        working-directory: ./flutter-app
        run: flutter pub get

      # 编译Debug测试APK
      # 只编 arm64-v8a：真机主流架构。x86/x86_64 仅模拟器用，且 Flutter 已宣布
      # 在 3.27 之后的稳定版移除 x86 支持；armeabi-v7a 为老设备兜底，按需再开。
      # 加 --target-platform 后只产出 app-arm64-v8a-debug.apk 一个文件，构建也更快。
      - name: Build Debug APK
        working-directory: ./flutter-app
        run: flutter build apk --debug --split-per-abi --target-platform android-arm64

      # 上传APK产物（仅 arm64 单包，保留 7 天）
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Debug-APK
          path: flutter-app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 7
