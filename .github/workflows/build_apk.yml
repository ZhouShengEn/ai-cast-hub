name: Build Flutter APK & Sync to Gitee
permissions:
  contents: write
  releases: write
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1.拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整拉取历史，同步Gitee需要

      # 2.配置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'

      # 3.安卓SDK环境
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4.缓存依赖加速打包
      - name: Cache Flutter & Gradle deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle
            flutter-app/.dart_tool
            flutter-app/build
          key: flutter-build-v3-${{ hashFiles('flutter-app/pubspec.yaml', 'flutter-app/android/app/build.gradle.kts') }}
          restore-keys: |
            flutter-build-v3-

      # 5.国内镜像安装依赖
      - name: Install dependencies
        working-directory: ./flutter-app
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
        run: flutter pub get

      # 6.编译Debug测试APK
      - name: Build Debug APK
        working-directory: ./flutter-app
        run: flutter build apk --debug

      # 调试：检查GH_PAT是否加载成功
      - name: Debug Token Check
        run: echo "Token length: ${{ length(secrets.GH_PAT) }}"

      # 7.上传APK到GitHub Release
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          ACTIONS_ALLOW_UNSECURE_NODE_VERSION: false
        with:
          tag_name: build-test01
          name: Flutter Build ${{ github.sha }}
          files: flutter-app/build/app/outputs/flutter-apk/*.apk

      # 8.同步整个仓库代码 + Release附件APK到Gitee
      - name: Sync code & APK release to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/ZhouShengEn/ai-cast-hub
          dst: gitee/zhou-sheng-en/ai-cast-hub
          gitee-token: ${{ secrets.GITEE_TOKEN }}
          sync-release: true
          sync-branch: true
