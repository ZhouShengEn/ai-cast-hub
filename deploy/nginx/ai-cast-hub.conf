# AI Cast Hub — VPS 站点配置（43.108.9.6）
#
# 部署方式：
#   cp deploy/nginx/ai-cast-hub.conf /etc/nginx/sites-available/ai-cast-hub
#   ln -s /etc/nginx/sites-available/ai-cast-hub /etc/nginx/sites-enabled/ai-cast-hub
#   nginx -t && systemctl reload nginx
#
# 说明：
#   - 与服务器上已有的 shiguangsha 站点完全隔离（独立 server_name、独立证书、独立日志），
#     不修改任何既有配置，避免影响其他服务。
#   - 后端 Node 服务监听 127.0.0.1:3100（3000 已被 shiguangsha 占用）。
#   - 证书由 certbot 签发到 /etc/letsencrypt/live/cast.zhoushengen.xyz/。

upstream ai_cast_server {
    server 127.0.0.1:3100;
    keepalive 32;
}

# HTTP：仅用于 ACME 校验与跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cast.zhoushengen.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：PC Web 静态站点 + 后端反代
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cast.zhoushengen.xyz;

    ssl_certificate     /etc/letsencrypt/live/cast.zhoushengen.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cast.zhoushengen.xyz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # PC Web 构建产物（vite build 输出目录）
    root /opt/workspace/ai-cast-hub/pc-web/dist;
    index index.html;

    # 文件传输功能需要更大的请求体上限
    client_max_body_size 50M;

    # 静态资源缓存（带 hash 的 assets 可长缓存）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # WebSocket（WebRTC 信令 / 远程控制实时通道）
    # 客户端连接地址：wss://<host>/ws?deviceUuid=...&transferKey=...
    location /ws {
        proxy_pass http://ai_cast_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端 API（server 路由挂载在 /api/v1）
    location /api/ {
        proxy_pass http://ai_cast_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/ai-cast-hub.access.log;
    error_log  /var/log/nginx/ai-cast-hub.error.log;
}
