# Coturn TURN/STUN 服务器配置
listening-port=3478
listening-ip=0.0.0.0

# 对外开放的 IP（需配置为实际公网或局域网 IP）
external-ip=__TURN_EXTERNAL_IP__

# 认证
user=ai_cast:ai_cast_turn
realm=ai-cast-hub

# 端口范围（用于 P2P 中继）
min-port=49152
max-port=65535

# 日志
verbose
log-file=/var/log/turnserver.log

# 长期凭证
lt-cred-mech

# 禁用不必要的协议
no-tls
no-dtls
